name: iOS cloud build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'FIELD iOS/**'
      - 'FIELD iOS.xcodeproj/**'
      - 'Tests/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'FIELD iOS/**'
      - 'FIELD iOS.xcodeproj/**'
      - 'Tests/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # This PR tests real screenshots on the ordinary public Apple Silicon runner. Intel remains for main previews.
    # Default PR/push compilation stays on the standard public ARM runner.
    runs-on: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[preview]'))) && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Restore Swift package cache
        uses: actions/cache@v4
        with:
          path: |
            build/DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ios-spm-${{ runner.os }}-${{ hashFiles('FIELD iOS.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ios-spm-${{ runner.os }}-
      - name: Validate Foundation tests and project references
        run: bash Tests/run-all-tests.sh
      - name: Compile independent SwiftUI simulator baseline (no boot)
        shell: bash
        run: bash Tests/build-runner-probe.sh
      - name: Compile and self-test nonblank native UI screenshot verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcrun swiftc -framework AppKit Tests/validate-screenshot.swift -o build/validate-screenshot
          python3 -m py_compile Tests/simulator-smoke.py
          python3 Tests/test_screenshot_contrast.py
      - name: Build for iPhone Simulator without signing
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project "FIELD iOS.xcodeproj" \
            -scheme "FIELD iOS" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/FIELD.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/xcodebuild.log
      - name: Verify MapLibre is embedded and iOS dynamic loader can find it
        shell: bash
        run: |
          set -euo pipefail
          APP='build/DerivedData/Build/Products/Debug-iphonesimulator/FIELD iOS.app'
          test -s "$APP/Frameworks/MapLibre.framework/MapLibre"
          BIN="$APP/FIELD iOS"
          if [[ -f "$APP/FIELD iOS.debug.dylib" ]]; then
            BIN="$APP/FIELD iOS.debug.dylib"
          fi
          xcrun otool -l "$BIN" > build/runtime-search-paths.txt
          if ! grep -q '@executable_path/Frameworks' build/runtime-search-paths.txt && \
             ! grep -q '@loader_path/Frameworks' build/runtime-search-paths.txt; then
            echo "MapLibre is packaged, but $BIN does not search its Frameworks directory."
            exit 1
          fi
          echo "PASS: MapLibre dynamic library is packaged and a framework rpath exists."
      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            'build/DerivedData/Build/Products/Debug-iphonesimulator/FIELD iOS.app' \
            build/FIELD-iOS-simulator.zip
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: FIELD-iOS-simulator
          path: build/FIELD-iOS-simulator.zip
          if-no-files-found: error
          retention-days: 1
      - name: Boot and install free iPhone simulator for UI screenshots
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[preview]')) || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[preview]'))
        timeout-minutes: 16
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/screenshots
          DEVICE="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ids=[x["udid"] for runtime,devices in sorted(d.items()) if "iOS" in runtime for x in devices if x.get("isAvailable") and "iPhone" in x.get("name","")]; print(ids[-1] if ids else "")')"
          if [[ -z "$DEVICE" ]]; then
            echo "No standard-runner iPhone Simulator runtime is installed."
            exit 1
          fi
          printf '%s\n' "$DEVICE" > build/screenshots/simulator-device-id.txt
          echo "Booting simulator before starting the screenshot timeout: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          # GitHub's Intel macOS runner may spend 5+ minutes booting. Bound the
          # subsequent installation independently, then take screenshots in
          # a new step with a fresh timeout; neither changes production code.
          python3 - "$DEVICE" <<'PY'
          import subprocess,sys,time
          device=sys.argv[1]
          app="build/DerivedData/Build/Products/Debug-iphonesimulator/FIELD iOS.app"
          # CoreSimulator's first install can hang on public Intel runners even
          # after bootstatus reports 'Finished'. Retry the same real app rather
          # than silently substituting a mockup or declaring screenshot success.
          installed=False
          for attempt in range(2):
              print(f"Installing real native app, attempt {attempt + 1}/2",flush=True)
              try:
                  result=subprocess.run(["xcrun","simctl","install",device,app],
                                        capture_output=True,text=True,timeout=185)
                  with open(f"build/screenshots/install-attempt-{attempt+1}.txt","w") as log:
                      log.write(f"exit={result.returncode}\n{result.stdout}\n{result.stderr}")
                  if result.returncode==0:
                      installed=True
                      break
                  print("Simulator app install returned error: "+result.stderr[-1000:],flush=True)
              except subprocess.TimeoutExpired:
                  print(f"Simulator install attempt {attempt + 1} timed out after 185s.",flush=True)
                  with open(f"build/screenshots/install-attempt-{attempt+1}.txt","w") as log:
                      log.write("simctl install timed out after 185 seconds\n")
              if attempt==0:
                  time.sleep(12)
          if not installed:
              raise SystemExit("Real app did not install: refusing synthetic UI screenshots.")
          # All screenshot launches use -FIELDRenderOnly, which never requests
          # hardware permissions. Do not invoke CoreSimulator privacy/status_bar
          # here: these commands have hung CoreSimulatorService on free hosted
          # Intel runners and then even the standalone launch probe times out.
          print("Simulator app installed; using render-only launch arguments for permission-free UI capture.",flush=True)
          # Bootstatus can finish before SpringBoard is ready for app launches.
          # Let the hosted free runner settle before the first launch request.
          time.sleep(20)
          PY
      - name: Capture unchanged Home and every redesigned secondary native screen
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[preview]')) || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[preview]'))
        # Five staged screenshots plus a slow Intel sim can exceed nine minutes.
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          DEVICE="$(cat build/screenshots/simulator-device-id.txt)"
          python3 Tests/simulator-smoke.py "$DEVICE"
      - name: Shutdown screenshot simulator
        if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[preview]')) || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[preview]')))
        continue-on-error: true
        timeout-minutes: 1
        run: |
          if [[ -s build/screenshots/simulator-device-id.txt ]]; then
            DEVICE="$(cat build/screenshots/simulator-device-id.txt)"
            xcrun simctl shutdown "$DEVICE" || true
          fi
      - name: Upload iPhone UI preview and launch diagnostics
        if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[preview]')) || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[preview]')))
        uses: actions/upload-artifact@v4
        with:
          name: FIELD-iOS-ui-preview-and-diagnostics
          path: build/screenshots/*
          if-no-files-found: warn
          retention-days: 1
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FIELD-iOS-build-diagnostics
          path: |
            build/xcodebuild.log
            build/FIELD.xcresult
          if-no-files-found: ignore
          retention-days: 3
